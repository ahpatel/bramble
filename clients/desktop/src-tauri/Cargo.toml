[package]
name = "bramble-desktop"
version = "0.1.0"
description = "Bramble password manager"
# Feeds the Maintainer field of the .deb and .rpm (Tauri falls back to `bundle.publisher` only
# when this is absent, and Debian policy wants a name AND an address). Kept here rather than in
# publisher so the Windows installer's Manufacturer stays a plain name.
authors = ["Bramble <support@bramble.sh>"]
license = "GPL-3.0-only"
edition = "2021"
publish = false
rust-version = "1.77.2"
# Required once the proxy made this a two-binary package: `tauri dev` shells out to a bare
# `cargo run`, which refuses to guess between them.
default-run = "bramble-desktop"

[lib]
# Tauri's own convention: main.rs is a shim over a lib so a mobile entry point can share it.
name = "bramble_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# macos-private-api is what allows a transparent window, which the spotlight panel needs so
# the native blur behind its webview shows through. It rules out the Mac App Store; Bramble
# ships direct downloads, so that is not a channel being given up. See docs/desktop-port.md.
tauri = { version = "2.12.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# The shared crypto core, linked as an ordinary cargo dependency: no wasm-bindgen and no
# uniffi, unlike the extension and mobile. `native` leaves both binding layers off and
# carries snow/k256 for the sync modules. This is what keeps the VEK in this process
# rather than in the webview. See docs/desktop-port.md.
vault-crypto = { path = "../../../packages/core-rust", default-features = false, features = ["native"] }
# The spotlight window's backdrop blur. CSS backdrop-filter cannot do this: it blurs what is
# behind an element within the same page, and the desktop behind a transparent window is not
# in that compositing tree. This inserts the native view (NSVisualEffectView / Acrylic) that
# can. No Linux implementation exists, where it degrades to an opaque panel.
window-vibrancy = "0.8.0"
# The spotlight hotkey. Registering it needs no extra OS permission on macOS; typing INTO
# another app later will (Accessibility), but that is auto-type's problem, not this one.
tauri-plugin-global-shortcut = "2.3.2"
sha2 = "0.10.9"
# 2FA codes for the quick-access panel's copy (src/totp.rs). Both already in the tree.
hmac = "0.12.1"
sha1 = "0.10.7"
getrandom = "0.3.4"
base64 = "0.23.1"
# Backup uploads run here, not in the webview: no S3 endpoint or WebDAV server grants CORS to
# `tauri://localhost`, and the credentials live in the OS credential store on this side. Already
# in the tree via the updater plugin; rustls keeps TLS uniform across the three platforms.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "http2",
    "system-proxy",
    # A large backup goes up as one WebDAV PUT whose body the webview writes in chunks.
    "stream",
] }
# Turning that chunk channel into the body stream. Already in the tree via reqwest.
futures-util = { version = "0.3", default-features = false }
bytes = "1"
# The bounded channel between those chunk writes and the body: a write waits until the network
# has taken the last one. Already in the tree via tauri.
tokio = { version = "1", features = ["sync", "net", "time", "io-util", "rt"] }
# One formatted timestamp: SigV4's `YYYYMMDDTHHMMSSZ`. Already in the tree via tauri.
chrono = "0.4"
# Backup credentials are the only plaintext provider secrets in this process, and they are
# handled while the vault may be locked; zeroize keeps freed copies from lingering.
zeroize = { version = "1.8", features = ["derive"] }
sys-locale = "0.3"
# The SSH agent (src/ssh_agent): the OpenSSH key container, its bcrypt-pbkdf decryption and the
# agent's wire encodings. Not its `rsa` feature, which pins rsa 0.9 and RUSTSEC-2023-0071.
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ecdsa", "ed25519", "p256", "p384", "p521", "encryption"] }
# RSA signatures for the agent, used directly: 0.10 is the first release with the Marvin fix.
rsa = { version = "0.10", features = ["pkcs1v15"] }
# SSH keys pasted as SEC1 or PKCS#8 PEM. p256 is already in the tree via vault-crypto; p384 and
# p521 are the larger curves SSH uses.
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
# Ed25519 SSH keys stored as PKCS#8, which is what a CXF import writes. Already in the tree via
# vault-crypto.
ed25519-dalek = { version = "2", default-features = false, features = ["pkcs8", "zeroize"] }
# The traits ssh-key signs and encodes through, which it does not re-export. Already in the tree
# via ssh-key.
signature = "2"
ssh-encoding = { version = "0.2", features = ["alloc"] }
# Updating the app in place. Desktop-gated as the plugin's own docs show, so a future mobile
# target does not try to build an updater that has no meaning there.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.14.1"
# Checking an update is in the public Sigsum log before installing it; offline, no network stack
# of its own. See src/update_log.rs.
sigsum = "0.4.0"
# Only for relaunching after an update lands.
tauri-plugin-process = "2.3.1"

# Starting at login. Not on macOS, which writes its own launch agent so System Settings can name
# the app (#138); see autostart.rs.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
# Opening the app while it runs in the background shows its window rather than starting a second
# copy over the same vault files (#164). macOS already does this for an app bundle.
tauri-plugin-single-instance = "2.5.5"

[dev-dependencies]
# Each storage test gets its own data dir, so they can run in parallel and clean up after
# themselves. The suite writes real files: the code under test is the filesystem behaviour.
tempfile = "3"

# The macOS launch agent's tests run on Linux too, where nothing else needs the crate.
[target.'cfg(unix)'.dev-dependencies]
plist = "1.10"

# The pairing private key lives in the OS credential store, not a file. Backends are
# per-platform and their deps do not cross-compile, so each target picks its own: the
# secret-service one pulls dbus, which has no business in a macOS build.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
# Writing and reading the launch agent's plist. Already in the tree via tauri.
plist = "1.10"
# Pinning the quick-access panel's window appearance. Already in the tree via tauri.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAppearance", "NSResponder", "NSWindow"] }
# Touch ID unlock: the access-controlled keychain item (security-framework, core-foundation) and
# the LAContext prompt (objc2, block2, objc2-foundation). All already in the tree via keyring and
# tauri. See src/biometric_macos.rs.
# OSX_10_15 is what makes the item, and every search for it, use the data protection keychain;
# without it macOS falls back to the login keychain, which has no biometric access control.
security-framework = { version = "3.7", features = ["OSX_10_15"] }
core-foundation = "0.10"
objc2 = { version = "0.6.4", features = ["exception"] }
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
# The browser link's transport. Windows has no unix sockets, so it is a named pipe, and a pipe
# handle opened without FILE_FLAG_OVERLAPPED serializes its I/O: a parked read would block the
# concurrent write that both `socket::serve_session` and the proxy depend on. interprocess is
# here for that overlapped plumbing and for the pipe's security descriptor, not for its
# cross-platform surface, which is unused: unix keeps UnixStream. See src/ipc.rs.
interprocess = "2.4"
# The native-messaging host registration. Windows browsers are told where the manifest is by a
# registry value rather than finding the file themselves; see src/manifest.rs.
winreg = "0.55"
# Windows Hello unlock: KeyCredentialManager signs the challenge whose signature wraps the VEK.
# Already in the tree via tauri. See src/biometric_windows.rs.
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# Building the pipe's DACL. `SecurityDescriptor::deserialize` takes the SDDL string form, and
# widestring is how interprocess spells the UTF-16 it wants; the version tracks its own.
widestring = "1"
# One SID lookup: the DACL has to name the current user, and the answer has to come from the
# process token rather than from %USERNAME%, which the parent process chooses.
#
# `Win32_Security_Credentials` is for a second, unrelated job: ENUMERATING the credential store,
# which keyring cannot do. It addresses one credential at a time by name, and an uninstall has to
# find names it was never told, since a backup secret is keyed by vault and target id. See
# `secure_store::purge_all`.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    # The SSH agent names the program that connected to its pipe.
    "Win32_System_Pipes",
    # ipc::shutdown flushes a pipe before disconnecting it.
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The native WebRTC engine, which only Linux needs: WebKitGTK is built without WebRTC, while
# macOS and Windows webviews have their own. See src/native_webrtc.rs.
vault-crypto = { path = "../../../packages/core-rust", default-features = false, features = [
    "native",
    "webrtc-native",
] }
# Both Linux backends, chosen at RUNTIME (see secure_store::tier): Secret Service where a
# session bus offers one, else kernel keyutils, which needs no daemon and works headless. Not the
# crate's `linux-native-sync-persistent` combo, which writes to keyutils AND Secret Service and
# fails the write if the latter is absent, so it cannot cover the case this is here for.
keyring = { version = "3.6.3", features = [
    "sync-secret-service",
    "linux-native",
    "crypto-rust",
] }

# The native-messaging host Chrome spawns. Its own bin rather than a mode of the app binary:
# the browser starts it on every launch, so it must not carry Tauri's startup cost, and
# keeping it separate is what lets it stay a byte pump that links almost nothing.
[[bin]]
name = "bramble-proxy"
path = "src/bin/proxy.rs"
required-features = ["proxy-bin"]

# Gates the proxy's [[bin]], on by default so cargo build, test and the staging script are
# unchanged. Tauri bundles a crate's binaries only when their required features are passed on its
# command line (tauri.conf.json's build.features does not count), so bundles carry the proxy as
# the staged sidecar instead. That is what lets a Developer ID signed macOS bundle leave it out:
# Tauri signs every bundled binary with the app's entitlements, and macOS kills a helper carrying
# Touch ID's restricted keychain entitlement without a profile of its own.
[features]
default = ["proxy-bin"]
proxy-bin = []
# The local-update test build only: trust Sigsum's test log and the throwaway key in
# BRAMBLE_UPDATE_LOG_TEST_KEY, so `pnpm updater:smoke` can serve a logged update. Never for a
# release; see src/update_log.rs.
update-log-test = []

# Dependencies are optimised even in dev builds. Argon2 is the reason: opening a default
# KeePassXC database (64 MiB, 106 rounds) costs ~51s unoptimised against ~3s optimised, which
# made `tauri dev` look broken and dominated `cargo test`. Only dependencies are affected, so
# this crate still compiles fast, and release output is unchanged.
[profile.dev.package."*"]
opt-level = 2
